name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install optional dependencies in root
        run: |
          echo "📦 Installing optional dependencies from root package.json..."
          # Extract and install optional dependencies from root package.json
          if [ -f "package.json" ]; then
            # Get optional dependencies from package.json
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            
            if [ -n "$OPTIONAL_DEPS" ]; then
              echo "Found optional dependencies: $OPTIONAL_DEPS"
              echo "Installing: $OPTIONAL_DEPS"
              npm install $OPTIONAL_DEPS
            else
              echo "ℹ️ No optional dependencies found in root package.json"
            fi
          else
            echo "⚠️ No root package.json found, skipping optional dependencies"
          fi

      - name: Build main site
        run: |
          echo "Building main site..."
          cd site
          npm install
          npm run build
          cd ..
          mkdir -p combined_build
          cp -r site/dist/* combined_build/

      - name: Build example projects
        run: |
          # Find all example directories
          for example_dir in examples/*/; do
            if [ -d "$example_dir" ]; then
              example_name=$(basename "$example_dir")
              echo "Building example: $example_name"
              cd "$example_dir"
              npm install
              npm run build
              cd ../..
              mkdir -p "combined_build/examples/$example_name"
              cp -r "$example_dir/dist/"* "combined_build/examples/$example_name/"
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './combined_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4