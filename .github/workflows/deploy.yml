name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - 'site/**'
      - 'examples/**'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      site_changed: ${{ steps.changes.outputs.site_changed }}
      examples_json: ${{ steps.changes.outputs.examples_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      
      - name: Detect changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD HEAD~1 || echo "")
          
          # Check site
          if echo "$CHANGED_FILES" | grep -q "^site/"; then
            echo "site_changed=true" >> $GITHUB_OUTPUT
          else
            echo "site_changed=false" >> $GITHUB_OUTPUT
          fi
          
          # Find changed examples
          EXAMPLES=""
          for example in examples/*/; do
            if [ -d "$example" ]; then
              example_name=$(basename "$example")
              if echo "$CHANGED_FILES" | grep -q "^examples/$example_name/"; then
                if [ -z "$EXAMPLES" ]; then
                  EXAMPLES="\"$example_name\""
                else
                  EXAMPLES="$EXAMPLES, \"$example_name\""
                fi
              fi
            fi
          done
          
          # Create JSON array
          if [ -n "$EXAMPLES" ]; then
            JSON_EXAMPLES="[$EXAMPLES]"
          else
            JSON_EXAMPLES="[]"
          fi
          
          echo "examples_json=$JSON_EXAMPLES" >> $GITHUB_OUTPUT

  build-site:
    needs: detect-changes
    if: needs.detect-changes.outputs.site_changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build site
        run: |
          cd site
          npm install --prefer-offline --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p combined_build
          cp -r site/dist/* combined_build/
      
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: combined_build/
          retention-days: 1

  build-examples:
    needs: detect-changes
    if: needs.detect-changes.outputs.examples_json != '[]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: ${{ fromJson(needs.detect-changes.outputs.examples_json || '[]') }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            examples/${{ matrix.example }}/node_modules
          key: ${{ runner.os }}-example-${{ matrix.example }}-${{ hashFiles('examples/${{ matrix.example }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-example-${{ matrix.example }}-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build example
        run: |
          cd examples/${{ matrix.example }}
          npm install --prefer-offline --no-audit --no-fund
          npm run build
          cd ../..
          mkdir -p combined_build/examples/${{ matrix.example }}
          cp -r examples/${{ matrix.example }}/dist/* combined_build/examples/${{ matrix.example }}/
      
      - name: Upload example artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.example }}-build
          path: combined_build/
          retention-days: 1

  combine-and-deploy:
    needs: [detect-changes, build-site, build-examples]
    if: |
      always() && 
      (needs.build-site.result == 'success' || needs.build-site.result == 'skipped') &&
      (needs.build-examples.result == 'success' || needs.build-examples.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Combine builds
        run: |
          mkdir -p final_build
          
          # Copy site build if exists
          if [ -d "artifacts/site-build" ]; then
            cp -r artifacts/site-build/* final_build/
          fi
          
          # Copy all example builds
          for example_dir in artifacts/example-*-build/; do
            if [ -d "$example_dir" ]; then
              cp -r "$example_dir"/* final_build/
            fi
          done
          
          # Create index page if missing
          if [ ! -f "final_build/index.html" ]; then
            cat > final_build/index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
              <title>Projects</title>
            </head>
            <body>
              <h1>Projects</h1>
              <ul>
                <li><a href="/Lilis-Game-Engine/">Main Site</a></li>
            EOF
            
            for example_dir in final_build/examples/*/; do
              if [ -d "$example_dir" ]; then
                example_name=$(basename "$example_dir")
                echo "                <li><a href=\"/Lilis-Game-Engine/examples/$example_name/\">$example_name</a></li>" >> final_build/index.html
              fi
            done
            
            echo "              </ul>" >> final_build/index.html
            echo "            </body>" >> final_build/index.html
            echo "            </html>" >> final_build/index.html
          fi
      
      - name: Upload final artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_build'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4