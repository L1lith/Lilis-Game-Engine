name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - 'demos/**'
      - 'site/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOTE: Workflow-level concurrency has been intentionally removed.
# Cancelling a workflow mid-build loses any cache saves from its
# in-progress jobs, which forces subsequent runs to rebuild work that
# was already done. Concurrency is now scoped to the deploy job only,
# so builds always run to completion while deploys stay serialized.

jobs:
  discover-demos:
    runs-on: ubuntu-latest
    outputs:
      demo_matrix: ${{ steps.set-matrix.outputs.demo_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover demo projects
        id: set-matrix
        run: |
          # Any directory under demos/ with a package.json is a demo.
          # Whether it gets built is decided later by whether it has
          # a "build" script.
          DEMOS=""
          for demo in demos/*/; do
            if [ ! -d "$demo" ]; then continue; fi
            demo_name=$(basename "$demo")
            if [ ! -f "demos/$demo_name/package.json" ]; then
              echo "⚠️ Skipping $demo_name - no package.json"
              continue
            fi
            if [ -z "$DEMOS" ]; then
              DEMOS="\"$demo_name\""
            else
              DEMOS="$DEMOS, \"$demo_name\""
            fi
          done

          if [ -n "$DEMOS" ]; then
            JSON_DEMOS="[$DEMOS]"
          else
            JSON_DEMOS="[]"
          fi

          echo "demo_matrix=$JSON_DEMOS" >> $GITHUB_OUTPUT
          echo "Found demos: $JSON_DEMOS"

          if [ -d "examples" ]; then
            echo "::warning::An 'examples/' directory still exists in the repo. Consider removing it to avoid confusion and bloat."
          fi

  build-site:
    runs-on: ubuntu-latest
    # A site build failure must not fail the workflow. The fallback path
    # (restore any cached site build, or skip) is handled below.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Capture the source hash BEFORE any build scripts mutate files.
      - name: Compute site source hash
        id: hash
        env:
          HASH: ${{ hashFiles('site/**', 'package.json', 'package-lock.json') }}
        run: echo "value=$HASH" >> $GITHUB_OUTPUT

      - name: Restore exact-match cached site build
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: site-build
          key: site-build-${{ steps.hash.outputs.value }}

      - name: Report cache status
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "Site unchanged; reusing cached build."
          else
            echo "Site changed or no cache; rebuilding."
          fi

      - name: Setup Node.js
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Cache npm dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            site/node_modules
          key: ${{ runner.os }}-site-v2-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-v2-
            ${{ runner.os }}-site-

      - name: Build site
        id: build
        if: steps.cache-restore.outputs.cache-hit != 'true'
        # If the build itself fails, we fall through to the fallback step.
        continue-on-error: true
        run: |
          cd site
          # Remove lilis-engine from the site's package.json so npm install
          # doesn't try to resolve the file:../.. path (which doesn't exist in CI).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {
              if (pkg[field]) delete pkg[field]['lilis-engine'];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --prefer-offline --no-audit --no-fund
          npm install lilis-engine@latest --no-audit --no-fund
          npm run build
          cd ..

          mkdir -p site-build
          cp -r site/dist/* site-build/

          echo "Site build size:"
          du -sh site-build

      # Fallback: if the build failed (or never ran because there was no
      # cache and the build crashed), restore any previously-cached site
      # build by prefix. If even that misses, we ship nothing for the site.
      - name: Fallback to any cached site build
        if: steps.cache-restore.outputs.cache-hit != 'true' && steps.build.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: site-build
          key: site-build-fallback-${{ github.run_id }}
          restore-keys: |
            site-build-

      - name: Save site build to cache
        if: steps.cache-restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: site-build
          key: site-build-${{ steps.hash.outputs.value }}

      - name: Upload site artifact
        if: hashFiles('site-build/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: site-build/
          retention-days: 1
          if-no-files-found: error

  build-demos:
    needs: discover-demos
    if: needs.discover-demos.outputs.demo_matrix != '[]'
    runs-on: ubuntu-latest
    # A demo build failure must not fail the workflow. Per-demo fallback
    # logic below handles restoring cached builds where available.
    continue-on-error: true
    strategy:
      matrix:
        demo: ${{ fromJson(needs.discover-demos.outputs.demo_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Frozen hash of demo source + root manifests.
      - name: Compute demo source hash
        id: hash
        env:
          HASH: ${{ hashFiles(format('demos/{0}/**', matrix.demo), 'package.json', 'package-lock.json') }}
        run: echo "value=$HASH" >> $GITHUB_OUTPUT

      - name: Restore exact-match cached demo build
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: demo-build
          key: demo-build-${{ matrix.demo }}-${{ steps.hash.outputs.value }}

      - name: Report cache status
        run: |
          if [ "${{ steps.cache-restore.outputs.cache-hit }}" = "true" ]; then
            echo "Demo '${{ matrix.demo }}' unchanged; reusing cached build."
          else
            echo "Demo '${{ matrix.demo }}' changed or no cache; rebuilding."
          fi

      - name: Setup Node.js
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: demos/${{ matrix.demo }}/package-lock.json

      - name: Cache npm dependencies
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            demos/${{ matrix.demo }}/node_modules
          key: ${{ runner.os }}-demo-v3-${{ matrix.demo }}-${{ hashFiles(format('demos/{0}/package-lock.json', matrix.demo)) }}
          restore-keys: |
            ${{ runner.os }}-demo-v3-${{ matrix.demo }}-
            ${{ runner.os }}-demo-${{ matrix.demo }}-

      - name: Build demo
        id: build
        if: steps.cache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          # Suggested base path for demos that want to opt in.
          DEMO_BASE_PATH: "./"
        run: |
          cd demos/${{ matrix.demo }}

          DEMO_OUTPUT=$(node -p "require('./package.json').demoOutputDir ?? 'dist'")
          echo "Output dir declared by demo: $DEMO_OUTPUT"

          # Remove lilis-engine from the demo's package.json so npm install
          # doesn't try to resolve a file:../.. path that doesn't exist in CI.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {
              if (pkg[field]) delete pkg[field]['lilis-engine'];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm install --prefer-offline --no-audit --no-fund
          npm install lilis-engine@latest --no-audit --no-fund

          HAS_BUILD=$(node -p "!!require('./package.json').scripts?.build")
          if [ "$HAS_BUILD" = "true" ]; then
            npm run build
          else
            echo "No build script present; treating demo as static."
          fi

          cd ../..

          if [ "$DEMO_OUTPUT" = "." ]; then
            SRC="demos/${{ matrix.demo }}"
          else
            SRC="demos/${{ matrix.demo }}/$DEMO_OUTPUT"
          fi

          if [ ! -d "$SRC" ]; then
            echo "::error::Expected output dir '$SRC' does not exist"
            exit 1
          fi

          if find "$SRC" -name .git 2>/dev/null | grep -q .; then
            echo "::error::Output for ${{ matrix.demo }} contains .git"
            exit 1
          fi

          mkdir -p "demo-build/demos/${{ matrix.demo }}"

          if [ "$DEMO_OUTPUT" = "." ]; then
            cp -r "$SRC"/. "demo-build/demos/${{ matrix.demo }}"/
            rm -f  "demo-build/demos/${{ matrix.demo }}/package.json" \
                   "demo-build/demos/${{ matrix.demo }}/package-lock.json"
            rm -rf "demo-build/demos/${{ matrix.demo }}/.github" \
                   "demo-build/demos/${{ matrix.demo }}/.git" \
                   "demo-build/demos/${{ matrix.demo }}/node_modules"
          else
            cp -r "$SRC"/* "demo-build/demos/${{ matrix.demo }}"/
          fi

          echo "Demo '${{ matrix.demo }}' output size:"
          du -sh "demo-build/demos/${{ matrix.demo }}"

      # Fallback: on build failure, try to restore ANY previously cached
      # build for this demo by prefix. Prefix matching means we get the
      # most recent cache entry whose key starts with the demo name, even
      # if the hash component differs.
      - name: Fallback to any cached build for this demo
        if: steps.cache-restore.outputs.cache-hit != 'true' && steps.build.outcome == 'failure'
        uses: actions/cache/restore@v4
        with:
          path: demo-build
          key: demo-build-${{ matrix.demo }}-fallback-${{ github.run_id }}
          restore-keys: |
            demo-build-${{ matrix.demo }}-

      - name: Save demo build to cache
        if: steps.cache-restore.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: demo-build
          key: demo-build-${{ matrix.demo }}-${{ steps.hash.outputs.value }}

      - name: Upload demo artifact
        # Skip upload entirely if we have no build output (fresh demo,
        # build failed, no prior cache). Nothing to ship.
        if: hashFiles('demo-build/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.demo }}-build
          path: demo-build/
          retention-days: 1
          if-no-files-found: error

  combine-and-deploy:
    needs: [build-site, build-demos]
    # Run whenever the upstream jobs didn't hard-fail. Because the build
    # jobs use continue-on-error, they report success even when their
    # build steps failed — the fallback logic inside each job has already
    # handled the failure case.
    if: |
      always() &&
      (needs.build-site.result == 'success' || needs.build-site.result == 'skipped') &&
      (needs.build-demos.result == 'success' || needs.build-demos.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: true
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./final_build
          merge-multiple: true
        # If no artifacts were produced at all, this step fails. That's
        # fine — a workflow with no build output has nothing to deploy.
        continue-on-error: false

      - name: Verify build contents
        run: |
          echo "Final build contents:"
          ls -la final_build/
          if [ -d "final_build/demos" ]; then
            echo "Demos:"
            ls -la final_build/demos/
          fi
          echo "Total size:"
          du -sh final_build

      - name: Upload final artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4