name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  discover-demos:
    runs-on: ubuntu-latest
    outputs:
      demo_matrix: ${{ steps.set-matrix.outputs.demo_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover demo projects
        id: set-matrix
        run: |
          # Any directory under demos/ with a package.json is a demo.
          # Whether it gets built is decided later by whether it has
          # a "build" script.
          DEMOS=""
          for demo in demos/*/; do
            if [ ! -d "$demo" ]; then continue; fi
            demo_name=$(basename "$demo")
            if [ ! -f "demos/$demo_name/package.json" ]; then
              echo "⚠️ Skipping $demo_name - no package.json"
              continue
            fi
            if [ -z "$DEMOS" ]; then
              DEMOS="\"$demo_name\""
            else
              DEMOS="$DEMOS, \"$demo_name\""
            fi
          done

          if [ -n "$DEMOS" ]; then
            JSON_DEMOS="[$DEMOS]"
          else
            JSON_DEMOS="[]"
          fi

          echo "demo_matrix=$JSON_DEMOS" >> $GITHUB_OUTPUT
          echo "Found demos: $JSON_DEMOS"

          if [ -d "examples" ]; then
            echo "::warning::An 'examples/' directory still exists in the repo. Consider removing it to avoid confusion and bloat."
          fi

  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            site/node_modules
          key: ${{ runner.os }}-site-v2-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-v2-
            ${{ runner.os }}-site-

      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi

      - name: Build site
        run: |
          cd site
          # Remove lilis-engine from the site's package.json so npm install
          # doesn't try to resolve the file:../.. path (which doesn't exist in CI).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {
              if (pkg[field]) delete pkg[field]['lilis-engine'];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --prefer-offline --no-audit --no-fund
          npm install lilis-engine@latest --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p combined_build
          cp -r site/dist/* combined_build/

          echo "Site build size:"
          du -sh combined_build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: combined_build/
          retention-days: 1
          if-no-files-found: error

  build-demos:
    needs: discover-demos
    if: needs.discover-demos.outputs.demo_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        demo: ${{ fromJson(needs.discover-demos.outputs.demo_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: demos/${{ matrix.demo }}/package-lock.json

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            demos/${{ matrix.demo }}/node_modules
          # v3 suffix: bumped to invalidate caches from the older
          # lilisDemo.type era.
          key: ${{ runner.os }}-demo-v3-${{ matrix.demo }}-${{ hashFiles(format('demos/{0}/package-lock.json', matrix.demo)) }}
          restore-keys: |
            ${{ runner.os }}-demo-v3-${{ matrix.demo }}-
            ${{ runner.os }}-demo-${{ matrix.demo }}-

      - name: Build demo
        run: |
          cd demos/${{ matrix.demo }}

          # Where does the final output live?
          # Default: "dist" (Vite, Astro, SvelteKit, etc.).
          # "." means the demo directory itself is the site root.
          DEMO_OUTPUT=$(node -p "require('./package.json').demoOutputDir ?? 'dist'")
          echo "Output dir declared by demo: $DEMO_OUTPUT"

          # Remove lilis-engine from the demo's package.json so npm install
          # doesn't try to resolve a file:../.. path that doesn't exist in CI.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const field of ['dependencies', 'devDependencies', 'peerDependencies']) {
              if (pkg[field]) delete pkg[field]['lilis-engine'];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

          npm install --prefer-offline --no-audit --no-fund
          npm install lilis-engine@latest --no-audit --no-fund

          # Trust the build script: if one exists, run it. If not, this is
          # a static demo and the browser resolves imports via an import map
          # declared in index.html.
          HAS_BUILD=$(node -p "!!require('./package.json').scripts?.build")
          if [ "$HAS_BUILD" = "true" ]; then
            npm run build
          else
            echo "No build script present; treating demo as static."
          fi

          cd ../..

          if [ "$DEMO_OUTPUT" = "." ]; then
            SRC="demos/${{ matrix.demo }}"
          else
            SRC="demos/${{ matrix.demo }}/$DEMO_OUTPUT"
          fi

          if [ ! -d "$SRC" ]; then
            echo "::error::Expected output dir '$SRC' does not exist"
            exit 1
          fi

          # Guard: never ship .git
          if find "$SRC" -name .git 2>/dev/null | grep -q .; then
            echo "::error::Output for ${{ matrix.demo }} contains .git"
            exit 1
          fi

          DEST="combined_build/demos/${{ matrix.demo }}"
          mkdir -p "$DEST"

          if [ "$DEMO_OUTPUT" = "." ]; then
            # Copy the whole demo directory, then strip files that shouldn't
            # be deployed: npm manifests, CI config, node_modules. When the
            # demo directory is the site root, these files would otherwise
            # become publicly downloadable.
            cp -r "$SRC"/. "$DEST"/
            rm -f  "$DEST/package.json" "$DEST/package-lock.json"
            rm -rf "$DEST/.github" "$DEST/.git" "$DEST/node_modules"
          else
            cp -r "$SRC"/* "$DEST"/
          fi

          echo "Demo '${{ matrix.demo }}' output size:"
          du -sh "$DEST"

      - name: Upload demo artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.demo }}-build
          path: combined_build/
          retention-days: 1
          if-no-files-found: error

  combine-and-deploy:
    needs: [build-site, build-demos]
    if: |
      always() &&
      (needs.build-site.result == 'success' || needs.build-site.result == 'skipped') &&
      (needs.build-demos.result == 'success' || needs.build-demos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./final_build
          merge-multiple: true

      - name: Verify build contents
        run: |
          echo "Final build contents:"
          ls -la final_build/
          if [ -d "final_build/demos" ]; then
            echo "Demos:"
            ls -la final_build/demos/
          fi
          echo "Total size:"
          du -sh final_build

      - name: Upload final artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4