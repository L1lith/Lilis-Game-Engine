name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
    # paths:
    #   - 'site/**'
    #   - 'demos/**'
    #   - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  discover-demos:
    runs-on: ubuntu-latest
    outputs:
      demo_matrix: ${{ steps.set-matrix.outputs.demo_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Discover demo projects
        id: set-matrix
        run: |
          # Find all directories in demos/ that contain package.json and astro.config.*
          DEMOS=""
          for demo in demos/*/; do
            if [ -d "$demo" ]; then
              demo_name=$(basename "$demo")
              # Check if it's a valid Astro project (has package.json and astro config)
              if [ -f "demos/$demo_name/package.json" ] && \
                 ( [ -f "demos/$demo_name/astro.config.js" ] || \
                   [ -f "demos/$demo_name/astro.config.mjs" ] || \
                   [ -f "demos/$demo_name/astro.config.ts" ] ); then
                if [ -z "$DEMOS" ]; then
                  DEMOS="\"$demo_name\""
                else
                  DEMOS="$DEMOS, \"$demo_name\""
                fi
              else
                echo "⚠️ Skipping $demo_name - not an Astro project"
              fi
            fi
          done
          
          # Create JSON array
          if [ -n "$DEMOS" ]; then
            JSON_DEMOS="[$DEMOS]"
          else
            JSON_DEMOS="[]"
          fi
          
          echo "demo_matrix=$JSON_DEMOS" >> $GITHUB_OUTPUT
          echo "Found demos: $JSON_DEMOS"

  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build site
        run: |
          cd site
          # Remove lilis-engine from the site's package.json so npm install
          # doesn't try to resolve the file:../.. path (which doesn't exist in CI
          # outside the checkout root and can behave differently in production).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.dependencies) delete pkg.dependencies['lilis-engine'];
            if (pkg.devDependencies) delete pkg.devDependencies['lilis-engine'];
            if (pkg.peerDependencies) delete pkg.peerDependencies['lilis-engine'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --prefer-offline --no-audit --no-fund
          # Install the latest published version of lilis-engine from npm
          npm install lilis-engine@latest --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p combined_build
          cp -r site/dist/* combined_build/
      
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: combined_build/
          retention-days: 1

  build-demos:
    needs: discover-demos
    if: needs.discover-demos.outputs.demo_matrix != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        demo: ${{ fromJson(needs.discover-demos.outputs.demo_matrix) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            demos/${{ matrix.demo }}/node_modules
          key: ${{ runner.os }}-demo-${{ matrix.demo }}-${{ hashFiles('demos/${{ matrix.demo }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-demo-${{ matrix.demo }}-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build demo
        id: build
        continue-on-error: true
        run: |
          cd demos/${{ matrix.demo }}
          # Remove lilis-engine from the demo's package.json so npm install
          # doesn't try to resolve the file:../.. path (which doesn't exist in CI
          # outside the checkout root and can behave differently in production).
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.dependencies) delete pkg.dependencies['lilis-engine'];
            if (pkg.devDependencies) delete pkg.devDependencies['lilis-engine'];
            if (pkg.peerDependencies) delete pkg.peerDependencies['lilis-engine'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --prefer-offline --no-audit --no-fund
          # Install the latest published version of lilis-engine from npm
          npm install lilis-engine@latest --no-audit --no-fund
          npm run build
          cd ../..
          mkdir -p combined_build/demos/${{ matrix.demo }}
          cp -r demos/${{ matrix.demo }}/dist/* combined_build/demos/${{ matrix.demo }}/
      
      - name: Upload demo artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.demo }}-build
          path: combined_build/
          retention-days: 1

  combine-and-deploy:
    needs: [build-site, build-demos]
    if: |
      always() && 
      (needs.build-site.result == 'success' || needs.build-site.result == 'skipped') &&
      (needs.build-demos.result == 'success' || needs.build-demos.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Combine builds
        run: |
          mkdir -p final_build
          
          # Copy site build if exists
          if [ -d "artifacts/site-build" ]; then
            cp -r artifacts/site-build/* final_build/
          fi
          
          # Copy all demo builds
          for demo_dir in artifacts/demo-*-build/; do
            if [ -d "$demo_dir" ]; then
              cp -r "$demo_dir"/* final_build/
            fi
          done
          
          echo "Final build contents:"
          ls -la final_build/
          if [ -d "final_build/demos" ]; then
            echo "Demos:"
            ls -la final_build/demos/
          fi
      
      - name: Upload final artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_build'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4