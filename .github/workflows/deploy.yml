name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions for GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build all projects
        run: |
          # Create combined build directory
          mkdir -p combined_build
          
          # Build main site (located at root/site)
          echo "Building main site..."
          cd site
          npm install
          npm run build
          cd ..
          
          # Copy main site build to root of combined_build
          cp -r site/dist/* combined_build/
          
          # Find and build all example projects
          echo "Finding example projects..."
          examples=$(find examples -maxdepth 1 -type d -not -path examples | sed 's|^\./||' | sort)
          
          for example in $examples
          do
            echo "Building $example..."
            cd $example
            npm install
            npm run build
            cd ../..
            
            # Copy example build to appropriate subdirectory
            mkdir -p combined_build/examples/$(basename $example)
            cp -r $example/dist/* combined_build/examples/$(basename $example)/
          done
          
          # List built projects for debugging
          echo "Built projects:"
          ls -la combined_build/
          if [ -d "combined_build/examples" ]; then
            echo "Examples:"
            ls -la combined_build/examples/
          fi

