name: Deploy Astro Sites to GitHub Pages

on:
  push:
    branches: [ "master" ]
    paths:
      - 'site/**'
      - 'examples/**'
      - '.github/workflows/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            site/node_modules
          key: ${{ runner.os }}-site-${{ hashFiles('site/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-site-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build site
        run: |
          cd site
          npm install --prefer-offline --no-audit --no-fund
          npm run build
          cd ..
          mkdir -p combined_build
          cp -r site/dist/* combined_build/
      
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: combined_build/
          retention-days: 1

  build-examples:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [pong, snake, breakout]  # REPLACE WITH YOUR ACTUAL EXAMPLE NAMES
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            examples/${{ matrix.example }}/node_modules
          key: ${{ runner.os }}-example-${{ matrix.example }}-${{ hashFiles('examples/${{ matrix.example }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-example-${{ matrix.example }}-
      
      - name: Install optional dependencies
        run: |
          if [ -f "package.json" ]; then
            OPTIONAL_DEPS=$(node -p "Object.keys(require('./package.json').optionalDependencies || {}).join(' ')" 2>/dev/null || echo "")
            if [ -n "$OPTIONAL_DEPS" ]; then
              npm install --prefer-offline --no-audit --no-fund $OPTIONAL_DEPS
            fi
          fi
      
      - name: Build example
        run: |
          cd examples/${{ matrix.example }}
          npm install --prefer-offline --no-audit --no-fund
          npm run build
          cd ../..
          mkdir -p combined_build/examples/${{ matrix.example }}
          cp -r examples/${{ matrix.example }}/dist/* combined_build/examples/${{ matrix.example }}/
      
      - name: Upload example artifact
        uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.example }}-build
          path: combined_build/
          retention-days: 1

  combine-and-deploy:
    needs: [build-site, build-examples]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Combine builds
        run: |
          mkdir -p final_build
          
          # Copy site build
          if [ -d "artifacts/site-build" ]; then
            cp -r artifacts/site-build/* final_build/
          fi
          
          # Copy all example builds
          for example_dir in artifacts/example-*-build/; do
            if [ -d "$example_dir" ]; then
              cp -r "$example_dir"/* final_build/
            fi
          done
      
      - name: Upload final artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './final_build'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4