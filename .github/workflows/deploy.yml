      #         .project-list a:hover { text-decoration: underline; }
      #       </style>
      #     </head>
      #     <body>
      #       <h1>🚀 Astro Projects</h1>
      #       <ul class="project-list">
      #         <li><a href="/${{ github.event.repository.name }}/">✨ Main Site</a></li>
      #     EOF
          
      #     for example_dir in examples/*/; do
      #       if [ -d "$example_dir" ]; then
      #         example_name=$(basename "$example_dir")
      #         echo "              <li><a href=\"/${{ github.event.repository.name }}/examples/$example_name/\">📦 $example_name</a></li>" >> combined_build/index.html
